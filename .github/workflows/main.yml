name: Build Prince Quest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GODOT_VERSION: "4.7.1"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          apt-get update
          apt-get install -y unzip

      - name: Extract Prince Quest
        run: |
          rm -rf game
          mkdir -p game
          unzip -q PrinceQuest-Godot-Android.zip -d game
          test -f game/project.godot
          test -f game/export_presets.cfg

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/

          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot ~/.config/
          fi

          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi

      - name: Enable Android launcher
        run: |
          sed -i 's/package\/show_as_launcher_app=false/package\/show_as_launcher_app=true/' game/export_presets.cfg

      - name: Import and validate project
        run: |
          godot --headless --verbose --editor --quit --path game

      - name: Build APK
        run: |
          mkdir -p game/build
          cd game
          godot --headless --verbose --export-debug "Android" build/PrinceQuest.apk
          test -f build/PrinceQuest.apk
          ls -lh build/PrinceQuest.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrinceQuest-Android-APK
          path: game/build/PrinceQuest.apk
          if-no-files-found: error
