name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GODOT_VERSION: "4.7.1"

jobs:
  build-android:
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y unzip python3 fontconfig libfontconfig1

      - name: Extract game
        run: |
          rm -rf game
          mkdir game
          unzip -q PrinceQuest-Godot-Android.zip -d game
          test -f game/project.godot
          test -f game/export_presets.cfg

      - name: Fix Android project settings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("game/project.godot")
          text = p.read_text()

          setting = 'textures/vram_compression/import_etc2_astc=true'

          if setting not in text:
              marker = '[rendering]'
              if marker in text:
                  text = text.replace(
                      marker,
                      marker + '\n' + setting,
                      1
                  )
              else:
                  text += '\n[rendering]\n' + setting + '\n'

          p.write_text(text)

          e = Path("game/export_presets.cfg")
          exp = e.read_text()

          exp = exp.replace(
              'package/show_as_launcher_app=false',
              'package/show_as_launcher_app=true'
          )

          exp = exp.replace('gradle_build/min_sdk="23"\n', '')
          exp = exp.replace('gradle_build/target_sdk="35"\n', '')

          e.write_text(exp)
          PY

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config

          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot ~/.config/
          fi

          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -a \
              /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
              ~/.local/share/godot/export_templates/
          fi

      - name: Import project
        run: |
          godot --headless --editor --quit --path game

      - name: Build APK
        run: |
          mkdir -p game/build
          cd game
          godot --headless --export-debug "Android" build/PrinceQuest.apk
          test -f build/PrinceQuest.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrinceQuest-APK
          path: game/build/PrinceQuest.apk
          if-no-files-found: error
